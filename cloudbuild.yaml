steps:
  - name: "node:20-slim"
    entrypoint: "bash"
    args: ["-c", "npm install --no-audit --no-fund"]

  - name: "node:20-slim"
    entrypoint: "bash"
    args: ["-c", "npm run typecheck"]

  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args: ["-c", "echo \"Security scan stage: placeholder for dependency/secret scanning\""]

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "--platform=linux/amd64"
      - "--build-arg"
      - "VITE_API_BASE_URL=https://backend-api-953962114781.us-central1.run.app/api"
      - "-t"
      - "us-central1-docker.pkg.dev/prj-dev-app-504417/app-images/web-app:$SHORT_SHA"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "us-central1-docker.pkg.dev/prj-dev-app-504417/app-images/web-app:$SHORT_SHA"

  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args: ["-c", "echo \"Image scan stage: placeholder for vulnerability scanning\""]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "web-app"
      - "--image=us-central1-docker.pkg.dev/prj-dev-app-504417/app-images/web-app:$SHORT_SHA"
      - "--region=us-central1"

images:
  - "us-central1-docker.pkg.dev/prj-dev-app-504417/app-images/web-app:$SHORT_SHA"

options:
  logging: CLOUD_LOGGING_ONLY
