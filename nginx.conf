server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: React Router handles /login, /register, and every
    # future module route entirely client-side. Without this, a direct
    # browser navigation to /register (not clicked from within the app —
    # a bookmark, a refresh, a shared link) would 404, since no real file
    # named "register" exists on disk. Any path that isn't a real static
    # file falls back to index.html, and React Router takes over from there.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Real static assets (JS/CSS bundles, fingerprinted by Vite's build)
    # are safe to cache aggressively — their filenames change whenever
    # their content does, so a stale cache is never actually stale.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
